# Proof Arena — local full-stack docker-compose for Task 15 demo.
#
# NOTES
#   - This is a LOCAL DEMO stack, not a production deployment.
#   - ADMIN_API_KEY below is an obvious demo placeholder. Override in
#     .env or env vars for anything non-local.
#   - Backend requires a Solana program client to do state transitions;
#     without one, settlement fails closed. See backend Dockerfile comments
#     for details about V1 operator expectations.
#
# USAGE
#   docker compose up --build
#   # then:
#   docker compose exec backend uv run alembic upgrade head
#
#   python scripts/run_demo.py  (from host, once services are healthy)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proof_arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_demo_placeholder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d proof_arena"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://arena:arena_demo_placeholder@postgres:5432/proof_arena
      ADMIN_API_KEY: demo-admin-key-change-me
      # Devnet demo defaults. The host keypair path can be overridden with
      # PROOF_ARENA_TREASURY_KEYPAIR_HOST before running docker compose.
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      SOLANA_CLUSTER: "devnet"
      TREASURY_KEYPAIR_PATH: "/run/secrets/proofarena-treasury-devnet.json"
      USDC_MINT: "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
      OPENROUTER_API_KEY: ""
    volumes:
      - ${PROOF_ARENA_TREASURY_KEYPAIR_HOST:-/Users/degencodebeast/.config/solana/proofarena-treasury-devnet.json}:/run/secrets/proofarena-treasury-devnet.json:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_PRIVY_APP_ID: demo-privy-app-id-change-me
    ports:
      - "3000:3000"

volumes:
  pgdata:
