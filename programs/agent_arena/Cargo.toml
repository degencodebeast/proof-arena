[package]
name = "agent-arena"
version = "0.1.0"
description = "Agent Arena — benchmark and reputation layer for on-chain AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
