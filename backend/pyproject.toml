[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena-backend"
version = "0.1.0"
description = "Agent Arena - benchmark and reputation layer for on-chain AI agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx[http2]>=0.27.0",
    "solders>=0.21.0",
    "solana>=0.35.0",
    "anchorpy>=0.20.0",
    "agno>=2.5.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Disable anchorpy pytest plugin — incompatible with Python 3.14
addopts = "-p no:anchorpy"
markers = [
    "integration: Task 15 integration tests (deterministic lifecycle, no live RPC)",
    "slow: tests that take more than a few seconds",
]
